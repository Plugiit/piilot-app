worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # Chemins temporaires sous /tmp : le conteneur tourne en utilisateur non
    # root et /var/cache/nginx ne lui est pas accessible en ecriture.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # L'admin n'a rien a faire dans un index de moteur de recherche.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Sonde interrogee par le HEALTHCHECK et par Coolify.
        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Les noms de fichiers sont hashes par Vite : le contenu d'une URL ne
        # change jamais, donc cache permanent et aucune revalidation.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            try_files $uri =404;
        }

        # index.html porte les references vers les bundles hashes : il doit
        # etre revalide a chaque chargement, sinon un onglet deja ouvert ne
        # verrait jamais un nouveau deploiement.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Routage cote client : toute URL inconnue rend l'application.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
