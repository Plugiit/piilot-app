{{define "layout"}}<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f3f4f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1b1b1b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f4;padding:32px 16px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e8e8e9;border-radius:12px;">
<tr><td style="padding:32px 32px 8px 32px;">
<p style="margin:0 0 24px 0;font-size:15px;font-weight:600;color:#ff782b;">Piilot</p>
<h1 style="margin:0 0 16px 0;font-size:20px;line-height:1.4;font-weight:600;">{{.Title}}</h1>
{{template "content" .}}
</td></tr>
<tr><td style="padding:16px 32px 32px 32px;">
<p style="margin:0;font-size:12px;line-height:1.6;color:#8d8d8d;">Si le bouton ne fonctionne pas, copiez cette adresse dans votre navigateur :<br><a href="{{.URL}}" style="color:#8d8d8d;word-break:break-all;">{{.URL}}</a></p>
</td></tr>
</table>
<p style="margin:16px 0 0 0;font-size:12px;color:#a2a3a7;">E-mail envoyé automatiquement par Piilot. Merci de ne pas y répondre.</p>
</td></tr>
</table>
</body>
</html>{{end}}

{{define "button"}}<p style="margin:24px 0;"><a href="{{.URL}}" style="display:inline-block;background:#ff782b;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 20px;border-radius:8px;">{{.Action}}</a></p>{{end}}
