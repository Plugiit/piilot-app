# Rechargement a chaud en developpement (make dev).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  # Le JSON est surveille pour openapi/openapi.json : la spec est embarquee
  # dans le binaire, donc la modifier sans reconstruire laisse l'API servir
  # l'ancienne — et le front en genere des types perimes sans rien remarquer.
  include_ext = ["go", "sql", "env", "json"]
  exclude_dir = ["tmp", "bin", "internal/repository/db"]
  exclude_regex = ["_test\\.go"]
  delay = 300
  stop_on_error = true

[log]
  time = true
