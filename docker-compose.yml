# Deploiement Coolify — ressource de type « Docker Compose ».
#
# Coolify lit ce fichier et transforme chaque ${VARIABLE} en variable
# modifiable dans l'onglet « Environment Variables » de la ressource :
#
#   ${VAR:?}          obligatoire — Coolify bloque le deploiement tant qu'elle est vide
#   ${VAR:-defaut}    pre-remplie avec la valeur par defaut, modifiable
#   SERVICE_*         generee par Coolify au premier deploiement, puis conservee
#                     (SERVICE_URL_* : domaine ; SERVICE_PASSWORD_* : secret ;
#                      SERVICE_USER_* : identifiant)
#
# Aucune valeur secrete n'est ecrite ici. Les valeurs saisies dans l'interface
# survivent a un changement de ce fichier.
#
# Le domaine se regle dans Coolify, sur le service « app » : Configuration >
# General > Domains, sous la forme https://piilot.example.fr:8080 — le :8080
# designe le port interne vers lequel Traefik route, pas le port public.
#
# « app » est la passerelle : elle recoit tout le trafic et le transmet a
# l'application proprement dite, le service « server ». C'est ce qui permet a
# l'updater de remplacer « server » sans coupure — la passerelle, elle, ne
# s'arrete jamais.

# L'application tourne sur l'image publiee a chaque release, et non sur un
# build fait sur le serveur : deploiement plus rapide, meme image partout, et
# c'est ce qui permet a l'updater de la mettre a jour en tirant la suivante.
# Pour construire depuis les sources : docker-compose.build.yml.
#
# PIILOT_TAG : `latest` suit toutes les versions et permet la mise a jour
# depuis l'interface ; `0.4` ne suit que les correctifs de la 0.4 ; `0.4.1`
# fige la version (l'updater n'a alors rien a mettre a jour).

services:
  # Passerelle : le seul service expose. Elle sonde les instances de
  # « server » chaque seconde et n'envoie le trafic qu'a une instance saine —
  # la plus recente pendant une mise a jour. Sans instance pendant plus de
  # quelques secondes, elle sert une page de maintenance qui se recharge
  # seule. Elle ne lit ni la base ni les secrets, et n'est mise a jour qu'au
  # redeploiement de la pile : c'est la piece qui ne doit pas s'arreter.
  app:
    image: ${PIILOT_IMAGE:-ghcr.io/plugiit/piilot-app}:${PIILOT_TAG:-latest}
    restart: unless-stopped
    entrypoint: ["/app/gateway"]
    environment:
      # Declare a Coolify que le service ecoute sur 8080 : Traefik y route le
      # domaine attribue. La passerelle ne lit pas cette variable.
      SERVICE_URL_APP_8080: ${SERVICE_URL_APP_8080}
      UPSTREAM: server:8080
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/gateway"]
      interval: 15s
      timeout: 5s
      retries: 3

  # L'application : API et front. Elle n'est jamais exposee directement, tout
  # passe par la passerelle. C'est ce service que l'updater remplace.
  server:
    image: ${PIILOT_IMAGE:-ghcr.io/plugiit/piilot-app}:${PIILOT_TAG:-latest}
    restart: unless-stopped
    environment:
      # --- Exposition -------------------------------------------------------
      # URL publique de l'application, sans le port interne.
      PUBLIC_BASE_URL: ${SERVICE_URL_APP}
      # Origines CORS. Le front etant servi par la meme image, CORS ne
      # s'applique pas : l'origine de l'app suffit.
      ADMIN_ORIGINS: ${SERVICE_URL_APP}
      # Vide = cookie lie au seul domaine de l'app, le reglage le plus etroit.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Un domaine par espace (facultatif). Vides, tout tient sur le domaine de
      # l'app. Renseignes — tous les quatre, sous un meme parent comme
      # https://team.agence.fr —, chaque espace a le sien : connexion, travail
      # de l'equipe, administration, portail client. Les quatre domaines
      # s'ajoutent aussi dans Coolify, sur le service « app » (voir README).
      AUTH_URL: ${AUTH_URL:-}
      TEAM_URL: ${TEAM_URL:-}
      ADMIN_URL: ${ADMIN_URL:-}
      CLIENT_URL: ${CLIENT_URL:-}

      # --- Application ------------------------------------------------------
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      MAX_UPLOAD_MIB: ${MAX_UPLOAD_MIB:-25}

      # --- Authentification -------------------------------------------------
      # 64 caracteres generes par Coolify ; l'API refuse de demarrer sous 32.
      JWT_SECRET: ${SERVICE_PASSWORD_64_JWT}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}

      # --- Mise a jour ------------------------------------------------------
      # Verification des nouvelles versions aupres des releases GitHub, pour
      # proposer la mise a jour aux admins. false pour une instance qui ne
      # doit rien appeler au-dehors.
      UPDATE_CHECK: ${UPDATE_CHECK:-true}
      # Intervalle entre deux verifications (5m au minimum).
      UPDATE_CHECK_INTERVAL: ${UPDATE_CHECK_INTERVAL:-15m}

      # --- E-mails ----------------------------------------------------------
      # Serveur SMTP des invitations et du mot de passe oublie. Facultatif :
      # vide, Piilot n'envoie rien et les liens se copient depuis l'ecran des
      # comptes. N'importe quel fournisseur convient (Brevo, Scaleway,
      # Mailjet…) ; pour le RGPD, un service heberge dans l'UE.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Expediteur : « Piilot <piilot@votre-agence.fr> ».
      SMTP_FROM: ${SMTP_FROM:-}
      # starttls (port 587), tls (port 465) ou none (serveur local de test).
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}

      # --- HTTP -------------------------------------------------------------
      READ_TIMEOUT: ${READ_TIMEOUT:-30s}
      WRITE_TIMEOUT: ${WRITE_TIMEOUT:-30s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
      # A l'arret, l'instance se declare en arret et sert encore ce temps-la,
      # que la passerelle l'ecarte avant qu'elle ne ferme ses connexions.
      DRAIN_DELAY: ${DRAIN_DELAY:-5s}

      # --- Dependances ------------------------------------------------------
      # Construites a partir des identifiants que Coolify genere pour les
      # services ci-dessous : rien a saisir. Les identifiants sont alphanumeriques,
      # donc surs dans une URL sans encodage.
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-piilot}?sslmode=disable
      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379/0
    volumes:
      # Pieces jointes des projets : sans volume, perdues a chaque deploiement.
      - piilot-files:/app/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Met l'application a jour quand un admin le demande depuis l'interface : tire
  # la nouvelle image et demarre un nouveau conteneur « server » a cote de
  # l'ancien, qui ne s'arrete qu'une fois le nouveau sain. La passerelle bascule
  # le trafic de l'un a l'autre : pas de coupure. Si le nouveau ne demarre pas,
  # il est supprime et l'ancien n'a jamais cesse de servir.
  #
  # C'est le seul conteneur qui recoit le socket Docker — l'application,
  # exposee sur Internet, ne l'a jamais. Il n'ouvre aucun port et ne recoit
  # d'ordre que par la base. Retirer ce service desactive la mise a jour depuis
  # l'interface, sans rien casser d'autre.
  updater:
    image: ${PIILOT_IMAGE:-ghcr.io/plugiit/piilot-app}:${PIILOT_TAG:-latest}
    restart: unless-stopped
    entrypoint: ["/app/updater"]
    # root : le socket Docker appartient a root sur l'hote. Ce conteneur a de
    # toute facon la main sur Docker ; l'utilisateur ne change rien a son
    # pouvoir, seulement a sa capacite a ouvrir le socket.
    user: "0"
    environment:
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-piilot}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPDATER_SERVICE: server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    # La sonde de l'image interroge l'API sur :8080, que l'updater ne sert
    # pas : sans ce reglage, il serait marque malade en permanence.
    healthcheck:
      disable: true

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-piilot}
    volumes:
      - piilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Mot de passe meme sur le reseau interne : un autre conteneur du serveur
    # ne doit pas pouvoir lire les compteurs de connexion ni le bus.
    command: ["redis-server", "--requirepass", "${SERVICE_PASSWORD_REDIS}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
    volumes:
      - piilot-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  piilot-files:
  piilot-postgres:
  piilot-redis:
