# Dependances de developpement local. L'API tourne hors conteneur (make dev)
# pour garder le rechargement a chaud.
services:
  postgres:
    image: postgres:17-alpine
    container_name: plugiit-postgres
    environment:
      POSTGRES_USER: plugiit
      POSTGRES_PASSWORD: plugiit
      POSTGRES_DB: plugiit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plugiit"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: plugiit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
