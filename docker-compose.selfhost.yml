# Installation hors Coolify : a combiner avec docker-compose.yml.
#
#   cp .env.example .env    # puis remplir les secrets
#   docker compose -f docker-compose.yml -f docker-compose.selfhost.yml up -d --build
#
# Coolify route le trafic par Traefik sans publier de port ; ailleurs, il faut
# l'exposer. Lie a 127.0.0.1 : l'application parle HTTP en clair, un reverse
# proxy (Caddy, nginx, Traefik) doit terminer le TLS devant elle — les cookies
# de session sont Secure en production et ne transitent pas sans HTTPS.
services:
  app:
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
